<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Bengala Demo</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Play"
    />
    <style media="screen">
      body {
        padding: 50px;
        background-color: #222;
        color: #ddd;
        font:
          14px 'Play',
          sans-serif;
      }
      a {
        color: #00b7ff;
      }
      h1,
      h2,
      h3 {
        color: #d75a26;
      }
      .panel {
        background: #333;
        padding: 20px;
        border-radius: 8px;
        max-width: 500px;
        margin-top: 20px;
      }
      button {
        background: #d75a26;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        margin-right: 8px;
        margin-top: 8px;
      }
      button:hover {
        background: #b5451a;
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        background: #444;
        border-radius: 4px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Bengala Demo</h1>
    <p>Adaptive Dual-Mode Presence Tracker</p>

    <div class="panel">
      <h3>Controls</h3>
      <p>
        Current Transport Mode:
        <span class="badge" id="transport-badge"
          >Auto (WS with HTTP Fallback)</span
        >
      </p>
      <button type="button" onclick="activate('auto')">
        Activate Auto Mode
      </button>
      <button type="button" onclick="activate('websocket')">
        Force Fast-Refresh (WebSocket)
      </button>
      <button type="button" onclick="activate('http')">
        Force Low-Budget (HTTP)
      </button>
      <p style="margin-top: 15px">
        <a href="test.html">Go to Secondary Page &rarr;</a>
      </p>
    </div>

    <script type="text/javascript">
      var _beng$wid = '00001';
      var _beng$transport = 'auto';

      function activate(mode) {
        window._beng$wid = '00001';
        window._beng$transport = mode;
        document.getElementById('transport-badge').innerText =
          mode.toUpperCase();
        if (window._bengala) {
          window._bengala.transport = mode;
          window._bengala.init();
        }
      }
    </script>
    <script type="module" src="/src/tracker.ts"></script>
  </body>
</html>
